name: shop-buy-wheat
description: >
  Fixture (solde remis à 100$ via la console Pterodactyl) puis funnel d'achat EconomyShopGUI
  complet : Menu -> Shop -> Farming -> Wheat -> achat. Vérifie le message d'achat et le solde
  après achat (via la lore de la tête joueur du shop).
steps:
  - console:
      server: survival
      command: "eco set {{player}} 100"
  - wait: 1

  - call: gui.close
    optional: true

  - call: chat.send
    args:
      message: "/menu"

  - call: container.read
    retry: 5
    expect:
      title: "Asteria Online - Menu"
      itemAt:
        10:
          name: Shop

  - call: container.click
    args:
      slot: 10

  - call: container.read
    retry: 5
    expect:
      title: "Server Shop"
      itemAt:
        10:
          name: Farming
      loreContains:
        45: "Balance: $100.00"

  - call: container.click
    args:
      slot: 10

  - call: container.read
    retry: 5
    expect:
      title: "Asteria Shop - Farming"
      itemAt:
        0:
          name: Wheat

  - call: container.click
    args:
      slot: 0

  - call: container.read
    retry: 5
    expect:
      title: "Buying > Wheat"
      loreContains:
        13: "$8.00"

  - call: container.click
    args:
      slot: 13
    screenshot: true

  - expect_chat: "successfully bought"
    timeout: 6

  - call: gui.close

  - call: chat.send
    args:
      message: "/menu"

  - call: container.read
    retry: 5
    expect:
      title: "Asteria Online - Menu"

  - call: container.click
    args:
      slot: 10

  - call: container.read
    retry: 5
    expect:
      title: "Server Shop"
      loreContains:
        45: "Balance: $92.00"

  - call: gui.close
