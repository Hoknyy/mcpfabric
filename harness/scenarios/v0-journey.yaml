name: v0-journey
destructive: true
# Parcours joueur v0 (compte non-OP) :
#   fixtures -> /spawn -> /menu -> shop + solde -> vente -> solde -> /rtp ->
#   /claim -> /sethome -> /spawn -> /home.
# Assertions de position/inventaire et messages système nouveaux après chaque action.
# Réservé à un UUID de compte jetable explicitement configuré.
# Contraintes :
# - /rtp a un cooldown de 600 s : attendre 10 min entre deux runs ;
# - ne jamais utiliser de tp console vers des chunks non générés (EssentialsX
#   charge le chunk en synchrone et peut figer le serveur ; incident du
#   2026-09-17). Les déplacements passent par /spawn, /rtp et /home.
steps:
  # ---------------------------------------------------------------- fixtures
  - log: "Fixtures : inventaire vide, solde 100, 16 charbons"
  - console: { server: survival, command: "clear {{player}}" }
  - console: { server: survival, command: "eco set {{player}} 100" }
  - console: { server: survival, command: "give {{player}} minecraft:coal 16" }
  - call: player.getInventory
    retry: 4
    expect: { inventoryCount: { "minecraft:coal": 16 } }

  # --------------------------------------------- 1. /spawn : position design
  - log: "1. /spawn : arrivée au spawn design"
  - call: gui.close
    optional: true
  - call: chat.send
    args: { message: "/spawn" }
  - call: player.getState
    retry: { timeout: 25, interval: 2 }
    expect:
      dimension: "minecraft:spawn"
      gte: { x: -2, y: -31, z: -183 }
      lte: { x: 3, y: -27, z: -178 }

  # -------------------------------------------------------- 2. menu principal
  - log: "2. /menu : structure du menu"
  - call: chat.send
    args: { message: "/menu" }
  - call: container.read
    retry: 8
    expect:
      title: "Asteria Online - Menu"
      itemAt:
        10: { name: Shop }
        11: { name: "Random Teleport" }
        12: { name: Claims }
        13: { name: Jobs }
        14: { name: Quests }
        15: { name: "Auction House" }
        16: { name: "Player Warps" }
        22: { name: Close }

  # ------------------------------------------------- 3. shop + solde initial
  - log: "3. Shop : solde initial affiché"
  - call: container.click
    args: { slot: 10 }
  - call: container.read
    retry: 5
    expect:
      title: "Server Shop"
      loreContains:
        45: "Balance: $100.00"
  - call: gui.close

  # ---------------------------------------------------------------- 4. vente
  - log: "4. /sellall : vente des 16 charbons"
  - call: chat.send
    args: { message: "/sellall" }
  - call: player.getInventory
    retry: 4
    expect: { inventoryCount: { "minecraft:coal": 0 } }
  - call: chat.send
    args: { message: "/menu" }
  - call: container.read
    retry: 5
    expect: { title: "Asteria Online - Menu" }
  - call: container.click
    args: { slot: 10 }
  - call: container.read
    retry: 5
    expect:
      title: "Server Shop"
      loreContains:
        45: "Balance: $148.00"
  - call: gui.close

  # ------------------------------------------- 5. rtp : Spawn -> monde world
  - log: "5. /rtp : téléportation du monde Spawn vers world"
  - call: chat.send
    args: { message: "/rtp" }
  - call: player.getState
    retry: { timeout: 30, interval: 2 }
    expect: { dimension: "minecraft:overworld" }

  # ------------------------------------------------------ 6. claim + sethome
  - log: "6. /claim + /sethome dans la nature"
  - call: player.getState
    save: claimPosition
    expect: { dimension: "minecraft:overworld" }
  - call: chat.send
    args: { message: "/claim" }
  - expect_chat: "Claim created!"
    save: claimCreated
    timeout: 5
  - call: chat.send
    args: { message: "/sethome mcp_{{runId}}" }
  - expect_chat: "Successfully set a new home called mcp_{{runId}}"
    save: homeCreated
    timeout: 5

  # ------------------------------------------------- 7. /spawn : retour design
  - log: "7. /spawn : retour au spawn design"
  - call: chat.send
    args: { message: "/spawn" }
  - call: player.getState
    retry: { timeout: 25, interval: 2 }
    expect:
      dimension: "minecraft:spawn"
      gte: { x: -2, y: -31, z: -183 }
      lte: { x: 3, y: -27, z: -178 }

  # ---------------------------------------------------- 8. /home : retour claim
  - log: "8. /home : retour au claim"
  - call: chat.send
    args: { message: "/home mcp_{{runId}}" }
  - call: player.getState
    retry: { timeout: 25, interval: 2 }
    expect:
      nearPosition: { baseline: "{{claimPosition}}", tolerance: 2 }

teardown:
  - call: gui.close
    optional: true
  - call: chat.send
    when: homeCreated
    args: { message: "/home mcp_{{runId}}" }
  - call: player.getState
    when: claimCreated
    retry: { timeout: 25, interval: 1 }
    expect:
      nearPosition: { baseline: "{{claimPosition}}", tolerance: 2 }
  - call: chat.send
    when: claimCreated
    args: { message: "/abandonclaim" }
  - expect_chat: "abandoned. You now have"
    when: claimCreated
    timeout: 5
  - call: chat.send
    when: homeCreated
    args: { message: "/delhome mcp_{{runId}}" }
  - expect_chat: "Successfully deleted your home, mcp_{{runId}}"
    when: homeCreated
    timeout: 5
  - console: { server: survival, command: "clear {{player}}" }
  - console: { server: survival, command: "eco set {{player}} 0" }
  - call: player.getInventory
    retry: 3
    expect: { hotbar: [], main: [] }
  - call: chat.send
    args: { message: "/menu" }
  - call: container.read
    retry: 5
    expect: { title: "Asteria Online - Menu" }
  - call: container.click
    args: { slot: 10, expectedItemName: Shop }
  - call: container.read
    retry: 5
    expect:
      title: "Server Shop"
      loreContains: { 45: "Balance: $0.00" }
  - call: gui.close
